<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex, nofollow">
<meta name="format-detection" content="telephone=no">
<!-- iPhone: runs full screen when added to the Home Screen -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Inner Circle">
<!-- Android / Chrome -->
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Inner Circle</title>
<style>
  :root {
    --ink: #111; --muted: #6b6b6b; --line: #dbdbdb; --soft: #efefef; --field: #fafafa;
    --green: #2f5d50; --amber: #d98a3d; --warn: #8a4a1c; --red: #d1352b;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bot: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { font-size: 16px; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  html.easy { font-size: 20px; }
  body {
    margin: 0; background: #fff; color: var(--ink); line-height: 1.4;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    overscroll-behavior-y: none; touch-action: manipulation;
  }
  #root { min-height: 100vh; min-height: 100dvh; }
  h1, h2, h3 { margin: 0; }
  button, input, textarea { font: inherit; color: inherit; }
  button { touch-action: manipulation; }
  input, textarea { font-size: max(16px, 1rem); }
  ::-webkit-scrollbar { display: none; }

  .serif { font-family: Georgia, "Times New Roman", serif; }
  .muted { color: var(--muted); }
  .grow { flex: 1; min-width: 0; }
  .row { display: flex; align-items: center; gap: .75rem; }
  .center { text-align: center; }

  .top {
    position: sticky; top: 0; z-index: 10; background: #fff;
    padding: calc(var(--safe-top) + .6rem) .5rem .4rem 1rem;
    display: flex; align-items: center; justify-content: space-between; min-height: 3.5rem;
  }
  .top.line { border-bottom: 1px solid var(--soft); }
  .top.back { padding-left: .25rem; }
  .top h1 { flex: 1; text-align: center; font-size: 1rem; font-weight: 700; }
  .brand { display: flex; align-items: center; gap: .5rem; font-family: Georgia, serif; font-weight: 700; font-size: 1.5rem; letter-spacing: -.02em; color: var(--green); }
  .ibtn { background: none; border: 0; width: 2.75rem; height: 2.75rem; padding: 0; display: flex; align-items: center; justify-content: center; color: var(--ink); cursor: pointer; position: relative; flex: none; }
  .badge { position: absolute; top: .55rem; right: .55rem; width: .6rem; height: .6rem; border-radius: 50%; background: var(--red); border: 2px solid #fff; }
  .tbtn { background: none; border: 0; color: var(--green); font-weight: 700; min-width: 3.5rem; min-height: 2.75rem; padding: 0 .75rem; cursor: pointer; }
  .tbtn:disabled { opacity: .4; }

  .page { padding-bottom: calc(5.25rem + var(--safe-bot)); }
  .pad { padding: 1rem; }

  .av { border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; flex: none; background: var(--green); }
  .stories { display: flex; gap: .7rem; padding: 2.5rem .9rem .8rem; overflow-x: auto; border-bottom: 1px solid var(--soft); }
  .story { flex: none; width: 4.6rem; text-align: center; position: relative; }
  .storybtn { display: block; width: 100%; background: none; border: 0; padding: 0; color: inherit; cursor: pointer; }
  .ring { width: 4.25rem; height: 4.25rem; border-radius: 50%; border: .16rem solid var(--amber); padding: .17rem; margin: 0 auto; display: block; }
  .ring.seen { border-color: var(--line); }
  .ring.none { border-color: transparent; }
  .ring .av { width: 100% !important; height: 100% !important; font-size: 1.3rem !important; }
  .plus { position: absolute; right: -.1rem; bottom: -.1rem; width: 1.4rem; height: 1.4rem; border-radius: 50%; background: var(--green); border: 2px solid #fff; display: flex; align-items: center; justify-content: center; }
  .slabel { font-size: .75rem; margin-top: .25rem; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; min-height: 1.8rem; }

  .post { border-bottom: 1px solid var(--soft); padding-bottom: .7rem; }
  .phead { display: flex; align-items: center; gap: .65rem; padding: .6rem .9rem; }
  .pname { font-weight: 600; font-size: .9rem; line-height: 1.2; }
  .psub { font-size: .75rem; color: var(--muted); }
  .photo { width: 100%; display: block; background: #eee; max-height: 75vh; max-height: 75dvh; object-fit: cover; }
  .photo.ph { height: 22rem; }
  .textpost { padding: 1.4rem 1.2rem; background: #f4efe6; font-family: Georgia, serif; font-size: 1.2rem; white-space: pre-wrap; }
  .acts { display: flex; align-items: center; padding: .15rem .4rem 0; }
  .likes { padding: 0 .9rem; font-size: .9rem; font-weight: 600; }
  .cap { padding: .2rem .9rem 0; font-size: .9rem; white-space: pre-wrap; overflow-wrap: anywhere; }
  .time { padding: .1rem .9rem 0; font-size: .75rem; color: var(--muted); }
  .linkish { background: none; border: 0; padding: .6rem .9rem; margin: -.2rem 0; color: var(--muted); font-size: .9rem; cursor: pointer; text-align: left; min-height: 2.75rem; display: block; }
  .pauthor { flex: 1; min-width: 0; display: flex; align-items: center; gap: .65rem; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; min-height: 2.75rem; }
  .pop { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); pointer-events: none; animation: pop .7s ease-out forwards; }
  @keyframes pop { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.4); } 25% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); } 100% { opacity: 0; transform: translate(-50%, -60%) scale(1); } }

  .nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: #fff; border-top: 1px solid var(--line);
    display: flex; padding: .2rem 0 calc(var(--safe-bot) + .1rem);
  }
  .nav button { flex: 1; background: none; border: 0; min-height: 3rem; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .1rem; color: var(--ink); font-size: .7rem; cursor: pointer; }
  .nav button { position: relative; }
  .lbl { display: block; font-size: .68rem; line-height: 1; }
  html.easy .lbl { font-size: .72rem; }
  html.easy .nav button { min-height: 3.8rem; }

  .btn { height: 2.75rem; border: 0; border-radius: .65rem; padding: 0 1.1rem; background: var(--green); color: #fff; font-weight: 700; cursor: pointer; }
  .btn.grey { background: var(--soft); color: var(--ink); }
  .btn.danger { background: #f8e1de; color: var(--red); }
  .btn.block { width: 100%; }
  .btn.sm { height: 2.75rem; padding: 0 .9rem; font-size: .9rem; }
  .btn:disabled { opacity: .5; }
  .linkbtn { background: none; border: 0; color: var(--green); font-weight: 700; min-height: 2.75rem; padding: 0 .25rem; cursor: pointer; }
  .field { width: 100%; height: 3.1rem; border: 1px solid var(--line); border-radius: .65rem; padding: 0 .9rem; background: var(--field); }
  textarea.field { height: auto; padding: .7rem .9rem; resize: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(5rem + var(--safe-bot)); background: #111; color: #fff; padding: .7rem 1.1rem; border-radius: .75rem; z-index: 60; max-width: 90%; text-align: center; font-size: .9rem; }

  .authwrap { min-height: 100vh; min-height: 100dvh; max-width: 26rem; margin: 0 auto; padding: calc(var(--safe-top) + 3.5rem) 2rem calc(var(--safe-bot) + 1.5rem); display: flex; flex-direction: column; }
  .stack > * + * { margin-top: .65rem; }

  .listrow { display: flex; align-items: center; gap: .75rem; padding: .6rem 1rem; width: 100%; background: none; border: 0; text-align: left; cursor: pointer; }
  .hdr { padding: .9rem 1rem .2rem; font-weight: 700; font-size: .8rem; color: var(--warn); }

  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; }
  .cell { aspect-ratio: 1 / 1; background: #eee; border: 0; padding: 0; overflow: hidden; cursor: pointer; display: block; }
  .cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cell .t { padding: .5rem; font-size: .75rem; text-align: left; font-family: Georgia, serif; background: #f4efe6; height: 100%; overflow: hidden; }
  .stat { text-align: center; }
  .stat b { display: block; font-size: 1.05rem; }
  .stat span { font-size: .8rem; color: var(--muted); }
  .tabline { display: flex; border-top: 1px solid var(--line); }
  .tabline div { flex: 1; display: flex; justify-content: center; padding: .7rem 0; }
  .tabline .on { border-top: 2px solid var(--ink); margin-top: -1px; }

  .cmt { display: flex; gap: .75rem; padding: .6rem 1rem; }
  .cmt.reply { padding-left: 3.4rem; }
  .cmt .meta { font-size: .75rem; color: var(--muted); margin-top: .2rem; }
  .cmt .meta button { background: none; border: 0; padding: .7rem .5rem; margin: -.7rem -.1rem -.7rem .3rem; font-weight: 700; color: var(--muted); font-size: .75rem; cursor: pointer; }
  .composer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: #fff; border-top: 1px solid var(--line); padding: .6rem 1rem calc(var(--safe-bot) + .6rem); display: flex; align-items: center; gap: .6rem; }
  .composer input { flex: 1; min-width: 0; height: 2.75rem; border: 1px solid var(--line); border-radius: 1.4rem; padding: 0 1rem; }

  .opt { display: flex; align-items: center; gap: .75rem; padding: .7rem 1rem; min-height: 3.5rem; border-bottom: 1px solid var(--soft); }
  .switch { width: 3.2rem; height: 1.95rem; border-radius: 1rem; background: #cfcfcf; border: 0; position: relative; flex: none; cursor: pointer; padding: 0; transition: background .15s; }
  .switch::after { content: ''; position: absolute; inset: -.6rem -.2rem; }
  .switch.on { background: var(--green); }
  .switch i { position: absolute; top: .125rem; left: .125rem; width: 1.7rem; height: 1.7rem; border-radius: 50%; background: #fff; transition: transform .15s; }
  .switch.on i { transform: translateX(1.25rem); }
  .promise { background: #eef4f1; border-radius: .9rem; padding: 1rem; margin: 1rem; }
  .promise ul { margin: .4rem 0 0; padding-left: 1.2rem; }
  .promise li { margin: .25rem 0; font-size: .9rem; }
  .card { border: 1px dashed #b9b9b9; border-radius: .9rem; margin: 1rem; padding: .9rem; }

  .viewer { position: fixed; inset: 0; z-index: 100; background: #000; color: #fff; display: flex; flex-direction: column; }
  .viewer .bars { display: flex; gap: 4px; padding: calc(var(--safe-top) + .6rem) .8rem 0; }
  .viewer .bars div { flex: 1; height: 3px; background: rgba(255,255,255,.35); border-radius: 2px; overflow: hidden; }
  .viewer .bars div i { display: block; height: 100%; width: 0; background: #fff; }
  @keyframes fill { from { width: 0; } to { width: 100%; } }
  .viewer .vh { display: flex; align-items: center; gap: .6rem; padding: .7rem .8rem; }
  .viewer .vimg { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; }
  .viewer .vimg img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .viewer .vcap { padding: .8rem 1rem calc(var(--safe-bot) + 1rem); font-size: 1rem; white-space: pre-wrap; }
  .viewer .tap { position: absolute; top: 0; bottom: 0; width: 35%; background: none; border: 0; padding: 0; z-index: 2; }

  .rowmain { flex: 1; min-width: 0; display: flex; align-items: center; gap: .75rem; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; min-height: 2.75rem; }
  .sec { color: var(--green); font-size: 1.15rem; margin: 1.4rem 0 .5rem; }
  .flabel { display: block; font-weight: 600; margin: 1rem 0 .3rem; }
  .aa, .aa2 { background: none; border: 1px solid var(--line); border-radius: .6rem; font-weight: 700; color: var(--green); cursor: pointer; min-width: 2.75rem; min-height: 2.75rem; }
  .aa { position: absolute; top: calc(var(--safe-top) + .6rem); right: 1rem; }
  .aa2 { border: 0; font-size: 1.05rem; }
  .authwrap { position: relative; }
  .scrim { position: fixed; inset: 0; z-index: 80; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; animation: fade .15s ease-out; }
  .sheet { width: 100%; max-width: 32rem; max-height: 88dvh; overflow-y: auto; background: #fff; border-radius: 1.1rem 1.1rem 0 0; padding: .5rem 1.1rem calc(var(--safe-bot) + 1.1rem); animation: rise .2s ease-out; }
  .grab { width: 2.5rem; height: .3rem; border-radius: .2rem; background: var(--line); margin: .2rem auto .8rem; }
  .sheet-title { font-family: Georgia, serif; font-size: 1.25rem; color: var(--green); margin-bottom: .6rem; }
  .sheetbtn { display: block; width: 100%; min-height: 3rem; background: none; border: 0; border-bottom: 1px solid var(--soft); text-align: left; padding: .5rem .2rem; font-size: 1rem; cursor: pointer; }
  .sheetbtn.danger { color: var(--red); font-weight: 600; }
  .sheetbtn:disabled { opacity: .5; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise { from { transform: translateY(30%); } to { transform: none; } }
  .carousel { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
  .slide { flex: none; width: 100%; scroll-snap-align: center; }
  .count { position: absolute; top: .7rem; right: .7rem; background: rgba(0,0,0,.6); color: #fff; font-size: .75rem; padding: .15rem .55rem; border-radius: 1rem; pointer-events: none; }
  .dots { display: flex; justify-content: center; gap: .3rem; padding: .5rem 0 0; }
  .dots i { width: .38rem; height: .38rem; border-radius: 50%; background: var(--line); }
  .dots i.on { background: var(--green); }
  .thumbs { display: flex; gap: .5rem; overflow-x: auto; padding: .7rem 1rem 0; }
  .thumb { position: relative; flex: none; width: 4.5rem; height: 4.5rem; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: .4rem; display: block; }
  .thumb button { position: absolute; top: -.35rem; right: -.35rem; width: 1.6rem; height: 1.6rem; border-radius: 50%; border: 2px solid #fff; background: #111; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer; }
  .addmore { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.6); color: #fff; font-size: .7rem; padding: .15rem 0; }
  .multi { position: absolute; top: .3rem; right: .3rem; display: flex; filter: drop-shadow(0 0 2px rgba(0,0,0,.6)); }
  .cell { position: relative; }
  .athumb { width: 2.75rem; height: 2.75rem; object-fit: cover; border-radius: .3rem; flex: none; }
  .welcomecard { margin: 1rem; padding: 1rem; border-radius: .9rem; background: #eef4f1; }
  .installbox { margin-top: 1rem; padding: .8rem; border-radius: .7rem; background: #f6f6f6; }
  .offline { position: sticky; top: 0; z-index: 90; background: #111; color: #fff; text-align: center; font-size: .85rem; padding: calc(var(--safe-top) + .4rem) .8rem .4rem; }
  .ptr { display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: .85rem; overflow: hidden; }
  :focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; } }
  .meter { height: .7rem; background: var(--soft); border-radius: .4rem; overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--green); }
  .viewer .vreply { display: flex; align-items: center; gap: .5rem; padding: .5rem .8rem calc(var(--safe-bot) + .6rem); }
  .viewer .vreply input { flex: 1; min-width: 0; height: 2.75rem; border-radius: 1.4rem; border: 1px solid rgba(255,255,255,.6); background: transparent; color: #fff; padding: 0 1rem; }
  .viewer .vreply input::placeholder { color: rgba(255,255,255,.7); }
  .viewer .vreply .tbtn:disabled { opacity: .4; }
  .camera { position: absolute; right: 0; bottom: 0; width: 1.9rem; height: 1.9rem; border-radius: 50%; background: var(--green); border: 3px solid #fff; display: flex; align-items: center; justify-content: center; }
  .knowcard { margin: 0 1rem 1rem; padding: 1rem; border-radius: 1rem; background: linear-gradient(135deg, #eef4f1, #fbf3e8); }
  .common { padding: .8rem 1rem; border-radius: 1rem; background: #fbf3e8; color: #6b4a1f; font-size: .9rem; margin-bottom: .4rem; }
  .common b { display: block; margin-bottom: .2rem; }
  .tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .6rem; }
  .tile { background: #f6f7f6; border-radius: 1rem; padding: .7rem .85rem; min-width: 0; }
  .tile.wide { grid-column: 1 / -1; }
  .tl { font-size: .72rem; color: var(--muted); font-weight: 600; letter-spacing: .02em; }
  .tv { font-size: .95rem; font-weight: 600; margin-top: .15rem; overflow-wrap: anywhere; display: flex; align-items: center; gap: .4rem; }
  .swatch { display: inline-block; width: 1rem; height: 1rem; border-radius: 50%; border: 1px solid rgba(0,0,0,.15); flex: none; }
  .chips { display: flex; flex-wrap: wrap; gap: .45rem; }
  .chip { border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 2rem; padding: .5rem .9rem; font-size: .9rem; min-height: 2.75rem; display: inline-flex; align-items: center; gap: .3rem; cursor: pointer; }
  span.chip { min-height: 0; padding: .35rem .8rem; cursor: default; }
  .chip small { opacity: .7; font-size: .75rem; }
  .chip.love.on { background: #e6f1ec; border-color: #9cc3b2; color: var(--green); font-weight: 600; }
  .chip.not.on { background: #f8e8e5; border-color: #e3aaa2; color: #9c2f24; font-weight: 600; }
  .chip.pick.on { background: #fbf0df; border-color: #e5bd85; color: #7a4a14; font-weight: 600; }
  .duel { display: flex; align-items: center; gap: .5rem; margin-bottom: .55rem; }
  .duel span { color: var(--muted); font-size: .8rem; }
  .duel button { flex: 1; min-height: 3rem; border-radius: .9rem; border: 1px solid var(--line); background: #fff; font-weight: 600; cursor: pointer; }
  .duel button.on { background: var(--green); border-color: var(--green); color: #fff; }
  .photo.vid { background: #000; max-height: 80dvh; object-fit: contain; }
  .check { display: flex; align-items: center; gap: .75rem; width: 100%; min-height: 3rem; padding: .4rem .2rem; background: none; border: 0; border-bottom: 1px solid var(--soft); text-align: left; cursor: pointer; }
  .check .box { flex: none; width: 1.5rem; height: 1.5rem; border-radius: .4rem; border: 2px solid #b9b9b9; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: .9rem; }
  .check.on .box { background: var(--green); border-color: var(--green); }
  .plist { max-height: 40dvh; overflow-y: auto; margin-bottom: .4rem; }
  .aud { padding: .15rem .9rem 0; font-size: .75rem; color: var(--green); font-weight: 600; display: flex; align-items: center; gap: .3rem; }
  .notes { display: flex; gap: .6rem; overflow-x: auto; padding: 1.7rem .9rem .6rem; border-bottom: 1px solid var(--soft); }
  .note { flex: none; width: 4.8rem; background: none; border: 0; padding: 0; display: flex; flex-direction: column; align-items: center; position: relative; cursor: pointer; color: inherit; min-height: 2.75rem; }
  .nbub { position: absolute; bottom: 3.4rem; left: 50%; transform: translateX(-50%); width: 4.8rem; max-height: 2.9rem; overflow: hidden; background: #f0f0f0; border-radius: 1rem; padding: .25rem .4rem; font-size: .68rem; line-height: 1.15; text-align: center; overflow-wrap: anywhere; z-index: 1; }
  .note.mine:not(.empty) .nbub { background: #e6f1ec; }
  .note.empty .nbub { background: #fff; border: 1px dashed #b9b9b9; color: var(--muted); }
  .nname { font-size: .72rem; margin-top: .2rem; max-width: 4.8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bigbub { background: #f0f0f0; border-radius: 1.2rem; padding: .8rem 1rem; font-size: 1.05rem; overflow-wrap: anywhere; }
  .pcard { margin: .8rem 1rem; padding: 1rem; border-radius: 1rem; background: linear-gradient(135deg, #fbf3e8, #f3ece0); }
  .pk { font-size: .72rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #8a4a1c; }
  .pt { font-family: Georgia, serif; font-size: 1.2rem; margin-top: .2rem; overflow-wrap: anywhere; }
  .promptbar { background: #fbf3e8; color: #6b4a1f; padding: .6rem 1rem; font-size: .9rem; }
  .newscard { margin: .8rem 1rem; padding: .9rem 1rem; border-radius: 1rem; background: #eef4f1; }
  .newsitem { padding: 1rem; border-bottom: 1px solid var(--soft); }
  .clamp { margin-top: .3rem; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-wrap; overflow-wrap: anywhere; }
  .pill { background: var(--red); color: #fff; font-size: .7rem; font-weight: 700; padding: .1rem .5rem; border-radius: 1rem; }
  .voice { background: #f6f6f6; border-radius: .8rem; padding: .7rem; display: flex; flex-direction: column; gap: .4rem; }
  .voice.rec { flex-direction: row; align-items: center; gap: .6rem; }
  .voice .dot { width: .7rem; height: .7rem; border-radius: 50%; background: var(--red); animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .25; } }
